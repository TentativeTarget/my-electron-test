<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
            content="default-src 'self'; connect-src 'self' http://127.0.0.1:8765; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
            content="default-src 'self'; connect-src 'self' http://127.0.0.1:8765; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <title>多人共享筆記 · CollabNote</title>
    <style>
        /* ─── 全域重置 & 字型 ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ─── 主容器 ─── */
        .app-container {
            width: 1440px;
            max-width: 100%;
            height: 900px;
            max-height: 100vh;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 25px 60px -15px rgba(0, 20, 30, 0.25);
            display: flex;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* ─── 側邊欄 ─── */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: #fafcff;
            border-right: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
            padding: 24px 16px 20px 20px;
            overflow-y: auto;
            position: relative;
        }

        /* 側邊欄 header */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-right: 4px;
        }

        .sidebar-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0b1a2b;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h2 i {
            color: #3b82f6;
            font-size: 22px;
        }

        .sidebar-header .badge {
            background: #eef3ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            letter-spacing: 0.2px;
        }

        /* 協作頭像群 */
        .collaborators {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            padding: 10px 12px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #eef2f8;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .collaborators .avatar-group {
            display: flex;
            margin-right: 4px;
        }

        .collaborators .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-left: -6px;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            cursor: default;
            transition: transform 0.15s;
        }

        .collaborators .avatar:first-child {
            margin-left: 0;
        }

        .collaborators .avatar:hover {
            transform: translateY(-2px);
        }

        .collaborators .avatar.a1 {
            background: #3b82f6;
        }
        .collaborators .avatar.a2 {
            background: #8b5cf6;
        }
        .collaborators .avatar.a3 {
            background: #ec4899;
        }
        .collaborators .avatar.a4 {
            background: #14b8a6;
        }
        .collaborators .avatar.a5 {
            background: #f59e0b;
        }

        .collaborators .online-count {
            font-size: 13px;
            color: #334155;
            font-weight: 500;
            margin-left: 4px;
        }

        .collaborators .online-count span {
            color: #22c55e;
            font-weight: 600;
        }

        /* 搜尋 / 篩選 */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #ffffff;
            font-size: 14px;
            color: #0b1a2b;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .search-box input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .search-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }

        /* 筆記列表 */
        .note-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 2px;
        }

        .note-list::-webkit-scrollbar {
            width: 4px;
        }

        .note-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .note-list::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 10px;
        }

        .note-item {
            display: flex;
            align-items: stretch;
            padding: 14px 14px 14px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
            margin-bottom: 4px;
            position: relative;
            border: 1px solid transparent;
        }

        .note-item:hover {
            background: #f1f5f9;
        }

        .note-item.active {
            background: #eef3ff;
            border-color: #b9d0fd;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.08);
        }

        .note-item .note-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #eef3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            font-size: 16px;
            margin-right: 14px;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .note-item.active .note-icon {
            background: #dbeafe;
        }

        .note-item .note-content {
            flex: 1;
            min-width: 0;
        }

        .note-item .note-title {
            font-size: 15px;
            font-weight: 600;
            color: #0b1a2b;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-item .note-title .tag {
            font-size: 10px;
            font-weight: 600;
            padding: 1px 10px;
            border-radius: 30px;
            background: #dbeafe;
            color: #2563eb;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .note-item .note-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #64748b;
        }

        .note-item .note-meta i {
            font-size: 11px;
            margin-right: 2px;
            color: #94a3b8;
        }

        .note-item .note-meta .editors {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .note-item .note-meta .editors .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 2px;
        }

        .dot.green {
            background: #22c55e;
        }
        .dot.yellow {
            background: #eab308;
        }
        .dot.purple {
            background: #8b5cf6;
        }
        .dot.blue {
            background: #3b82f6;
        }
        .dot.pink {
            background: #ec4899;
        }

        .note-item .note-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.15s;
            margin-left: 6px;
        }

        .note-item:hover .note-actions {
            opacity: 1;
        }

        .note-item .note-actions button {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 4px 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: color 0.15s, background 0.15s;
        }

        .note-item .note-actions button:hover {
            color: #0b1a2b;
            background: #e2e8f0;
        }

        .delete-dialog-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.35);
            z-index: 10;
        }

        .delete-dialog-backdrop.visible {
            display: flex;
            animation: delete-dialog-fade-in 180ms ease-out both;
        }

        .delete-dialog-backdrop.closing {
            display: flex;
            pointer-events: none;
            animation: delete-dialog-fade-out 180ms ease-in both;
        }

        @keyframes delete-dialog-fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes delete-dialog-fade-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .delete-dialog {
            width: min(400px, 100%);
            padding: 24px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
        }

        .delete-dialog h2 {
            color: #0b1a2b;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .delete-dialog p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .delete-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .delete-dialog-actions button {
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            padding: 9px 16px;
        }

        .delete-cancel-btn {
            background: #f1f5f9;
            color: #334155;
        }

        .delete-confirm-btn {
            background: #dc2626;
            color: #ffffff;
        }

        .delete-dialog-actions button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        /* 側邊欄底部 - 新增筆記 */
        .sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid #edf2f7;
            margin-top: 8px;
        }

        .btn-new-note {
            width: 100%;
            padding: 12px 0;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-new-note:hover {
            background: #2563eb;
        }

        .btn-new-note:active {
            transform: scale(0.97);
        }

        /* ─── 右側編輯區 ─── */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            padding: 28px 36px 30px 36px;
            overflow-y: auto;
            min-width: 0;
        }

        .editor-panel::-webkit-scrollbar {
            width: 5px;
        }

        .editor-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .editor-panel::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 10px;
        }

        /* 編輯器頂部 */
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .editor-header .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .editor-header .left .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #22c55e;
            background: #f0fdf4;
            padding: 4px 14px 4px 12px;
            border-radius: 40px;
            font-weight: 500;
        }

        .editor-header .left .status i {
            font-size: 10px;
        }

        .editor-header .left .status .pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .editor-header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .editor-header .right .share-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #0b1a2b;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .editor-header .right .share-btn:hover {
            background: #e2e8f0;
        }

        .editor-header .right .share-btn i {
            color: #3b82f6;
        }

        .editor-header .right .avatar-stack {
            display: flex;
            margin-left: 4px;
        }

        .editor-header .right .avatar-stack .mini-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            margin-left: -6px;
            border: 2px solid #fff;
            cursor: default;
        }

        .editor-header .right .avatar-stack .mini-avatar:first-child {
            margin-left: 0;
        }

        .editor-header .right .avatar-stack .mini-avatar.m1 {
            background: #3b82f6;
        }
        .editor-header .right .avatar-stack .mini-avatar.m2 {
            background: #8b5cf6;
        }
        .editor-header .right .avatar-stack .mini-avatar.m3 {
            background: #ec4899;
        }

        /* 標題輸入 */
        .note-title-input {
            border: none;
            font-size: 28px;
            font-weight: 700;
            color: #0b1a2b;
            padding: 6px 0 12px 0;
            outline: none;
            background: transparent;
            width: 100%;
            letter-spacing: -0.4px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
            margin-bottom: 18px;
        }

        .note-title-input:focus {
            border-bottom-color: #3b82f6;
        }

        .note-title-input::placeholder {
            color: #cbd5e1;
            font-weight: 500;
        }

        /* 工具列 */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 0 14px 0;
            border-bottom: 1px solid #edf2f7;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .toolbar button {
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 10px;
            color: #475569;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }

        .toolbar button:hover {
            background: #f1f5f9;
            color: #0b1a2b;
        }

        .toolbar .divider {
            width: 1px;
            height: 24px;
            background: #e2e8f0;
            margin: 0 4px;
        }

        /* 編輯內容 */
        .editor-content {
            flex: 1;
            min-height: 240px;
        }

        .editor-content textarea {
            width: 100%;
            height: 100%;
            min-height: 300px;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            line-height: 1.7;
            color: #1e293b;
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 4px 0;
            letter-spacing: 0.1px;
        }

        .editor-content textarea::placeholder {
            color: #cbd5e1;
            font-weight: 400;
        }

        /* 編輯器底部資訊 */
        .editor-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #edf2f7;
            font-size: 13px;
            color: #94a3b8;
            flex-wrap: wrap;
            gap: 8px;
        }

        .editor-footer .left-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .editor-footer .left-info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .editor-footer .left-info i {
            font-size: 13px;
        }

        .editor-footer .right-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .editor-footer .right-info .cursor-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-footer .right-info .cursor-indicator .cursor-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .cursor-dot.c1 {
            background: #3b82f6;
        }
        .cursor-dot.c2 {
            background: #8b5cf6;
        }
        .cursor-dot.c3 {
            background: #ec4899;
        }

        /* ─── 響應式 ─── */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
                height: auto;
                border-radius: 20px;
                max-height: 100vh;
            }

            .sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
                border-bottom: 1px solid #edf2f7;
                max-height: 380px;
                padding: 18px 16px 16px 16px;
            }

            .editor-panel {
                padding: 22px 20px 24px 20px;
            }

            .note-title-input {
                font-size: 24px;
            }

            .collaborators {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 8px;
            }

            .app-container {
                border-radius: 16px;
            }

            .editor-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .editor-header .right {
                width: 100%;
                justify-content: flex-start;
            }

            .note-item {
                padding: 12px 10px;
            }

            .note-item .note-icon {
                width: 32px;
                height: 32px;
                font-size: 14px;
                margin-right: 10px;
            }
        }

        /* 自訂捲軸 (Firefox) */
        .sidebar,
        .editor-panel {
            scrollbar-width: thin;
            scrollbar-color: #d1d9e6 transparent;
        }

        /* 選取文字標示 */
        .note-item.active .note-title {
            color: #1d4ed8;
        }

        /* 空狀態提示 (隱藏) */
        .empty-hint {
            display: none;
        }

        /* 點擊漣漪 */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        /* 模擬多人游標 (純UI) */
        .fake-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #3b82f6;
            animation: blink 1s step-end infinite;
            margin-left: 1px;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .fake-cursor.purple {
            background: #8b5cf6;
        }
        .fake-cursor.pink {
            background: #ec4899;
        }
    </style>
  </head>
<body>

    <div class="app-container">
        <!-- ===== 左側邊欄 ===== -->
        <aside class="sidebar">

            <!-- 標題 -->
            <div class="sidebar-header">
                <h2>
                    <i class="fas fa-pencil-alt"></i> CollabNote
                </h2>
                <span class="badge"><i class="fas fa-users" style="margin-right: 4px;"></i>團隊</span>
            </div>

            <!-- 協作者 -->
            <div class="collaborators">
                <div class="avatar-group">
                    <div class="avatar a1" title="Alice (編輯中)">A</div>
                    <div class="avatar a2" title="Bob">B</div>
                    <div class="avatar a3" title="Carol">C</div>
                    <div class="avatar a4" title="Dave">D</div>
                    <div class="avatar a5" title="Eve">E</div>
                </div>
                <div class="online-count">
                    <span>●</span> 5 位線上
                </div>
            </div>

            <!-- 搜尋 -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="搜尋筆記..." id="searchInput" />
            </div>

            <!-- 筆記列表 -->
            <div class="note-list" id="noteList"></div>

            <!-- 新增按鈕 -->
            <div class="sidebar-footer">
                <button class="btn-new-note" id="newNoteBtn">
                    <i class="fas fa-plus-circle"></i> 新增筆記
                </button>
            </div>
        </aside>

        <!-- ===== 右側編輯區 ===== -->
        <main class="editor-panel">

            <!-- 編輯器頭部 -->
            <div class="editor-header">
                <div class="left">
                    <div class="status">
                        <span class="pulse"></span>
                        已同步
                        <i class="fas fa-check-circle" style="font-size:12px;"></i>
                    </div>
                </div>
                <div class="right">
                    <div class="avatar-stack">
                        <div class="mini-avatar m1" title="Alice 正在編輯">A</div>
                        <div class="mini-avatar m2" title="Bob 檢視中">B</div>
                        <div class="mini-avatar m3" title="Carol 檢視中">C</div>
                    </div>
                    <button class="share-btn"><i class="fas fa-share-alt"></i> 分享</button>
                </div>
            </div>

            <!-- 標題 -->
            <input type="text" class="note-title-input" placeholder="輸入筆記標題..." id="noteTitleInput" />

            <!-- 工具列 -->
            <div class="toolbar">
                <button title="粗體"><i class="fas fa-bold"></i></button>
                <button title="斜體"><i class="fas fa-italic"></i></button>
                <button title="底線"><i class="fas fa-underline"></i></button>
                <button title="刪除線"><i class="fas fa-strikethrough"></i></button>
                <span class="divider"></span>
                <button title="項目符號"><i class="fas fa-list-ul"></i></button>
                <button title="編號列表"><i class="fas fa-list-ol"></i></button>
                <span class="divider"></span>
                <button title="連結"><i class="fas fa-link"></i></button>
                <button title="圖片"><i class="fas fa-image"></i></button>
                <button title="表格"><i class="fas fa-table"></i></button>
                <span class="divider"></span>
                <button title="註解"><i class="fas fa-comment"></i></button>
                <button title="歷史"><i class="fas fa-history"></i></button>
            </div>

            <!-- 編輯內容 -->
            <div class="editor-content">
                <textarea id="noteContent" placeholder="開始撰寫筆記… 支援 Markdown 語法"></textarea>
            </div>

            <!-- 底部資訊 -->
            <div class="editor-footer">
                <div class="left-info">
                    <span><i class="far fa-save"></i> 自動儲存中</span>
                    <span><i class="far fa-eye"></i> 3 人檢視</span>
                    <span><i class="far fa-edit"></i> 1 人編輯</span>
                </div>
                <div class="right-info">
                    <div class="cursor-indicator">
                        <span class="cursor-dot c1"></span>
                        <span>Alice 正在編輯</span>
                    </div>
                    <div class="cursor-indicator">
                        <span class="cursor-dot c2"></span>
                        <span>Bob 檢視</span>
                    </div>
                    <div class="cursor-indicator">
                        <span class="cursor-dot c3"></span>
                        <span>Carol 檢視</span>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <div class="delete-dialog-backdrop" id="deleteDialog" role="dialog" aria-modal="true" aria-labelledby="deleteDialogTitle">
        <div class="delete-dialog">
            <h2 id="deleteDialogTitle">確認刪除筆記？</h2>
            <p id="deleteDialogMessage">刪除後將無法恢復這篇筆記。</p>
            <div class="delete-dialog-actions">
                <button class="delete-cancel-btn" id="cancelDeleteBtn" type="button">取消</button>
                <button class="delete-confirm-btn" id="confirmDeleteBtn" type="button">刪除</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM 參考 ───
            const noteTitleInput = document.getElementById('noteTitleInput');
            const noteContent = document.getElementById('noteContent');
            const searchInput = document.getElementById('searchInput');
            const newNoteBtn = document.getElementById('newNoteBtn');
            const noteList = document.getElementById('noteList');
            const deleteDialog = document.getElementById('deleteDialog');
            const deleteDialogMessage = document.getElementById('deleteDialogMessage');
            const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
            const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
            const apiBaseUrl = window.collabNoteApi?.baseUrl || 'http://127.0.0.1:8765';
            let saveTimer;
            let pendingDeleteId;
            let dialogCloseTimer;

            async function apiRequest(path, options = {}, attempts = 8) {
                try {
                    const response = await fetch(`${apiBaseUrl}${path}`, {
                        headers: { 'Content-Type': 'application/json' },
                        ...options
                    });
                    if (!response.ok) {
                        throw new Error(`API ${response.status}`);
                    }
                    return response.json();
                } catch (error) {
                    const networkError = error.name === 'TypeError' || error.message === 'fetch failed';
                    if (attempts <= 1 || !networkError) throw error;
                    await new Promise(resolve => setTimeout(resolve, 100));
                    return apiRequest(path, options, attempts - 1);
                }
            }

            function saveActiveNote() {
                const data = notesData.find(d => d.id === activeId);
                if (!data) return;
                clearTimeout(saveTimer);
                saveTimer = setTimeout(async () => {
                    try {
                        await apiRequest(`/api/notes/${data.id}`, {
                            method: 'PUT',
                            body: JSON.stringify({ title: data.title, content: data.content })
                        });
                    } catch (error) {
                        console.error('筆記儲存失敗', error);
                    }
                }, 350);
            }

            function saveActiveNoteImmediately() {
                const data = notesData.find(d => d.id === activeId);
                if (!data) return;
                fetch(`${apiBaseUrl}/api/notes/${data.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: data.title, content: data.content }),
                    keepalive: true
                }).catch(error => console.error('關閉前儲存失敗', error));
            }

            const notesData = [];

            // ─── 狀態 ───
            let activeId = 1;

            // ─── 函式：切換筆記 ───
            function switchNote(id) {
                // 更新 active 樣式
                document.querySelectorAll('.note-item').forEach(el => {
                    el.classList.remove('active');
                    if (parseInt(el.dataset.id) === id) {
                        el.classList.add('active');
                    }
                });

                // 找資料
                const data = notesData.find(d => d.id === id);
                if (!data) return;

                activeId = id;
                noteTitleInput.value = data.title;
                noteContent.value = data.content;

                // 可選：更新標題旁的 tag (但我們保留靜態 UI，不強制更新)
                // 此處僅做內容與標題同步
            }

            function openDeleteDialog(id) {
                const note = notesData.find(item => item.id === id);
                if (!note) return;
                pendingDeleteId = id;
                clearTimeout(dialogCloseTimer);
                deleteDialog.classList.remove('closing');
                deleteDialogMessage.textContent = `確定要刪除「${note.title}」嗎？刪除後將無法恢復。`;
                deleteDialog.classList.add('visible');
                confirmDeleteBtn.focus();
            }

            function closeDeleteDialog() {
                pendingDeleteId = undefined;
                deleteDialog.classList.remove('visible');
                deleteDialog.classList.add('closing');
                clearTimeout(dialogCloseTimer);
                dialogCloseTimer = setTimeout(() => {
                    deleteDialog.classList.remove('closing');
                }, 180);
            }

            async function deleteNote() {
                if (pendingDeleteId === undefined) return;
                const noteId = pendingDeleteId;
                const noteItem = noteList.querySelector(`[data-id="${noteId}"]`);
                confirmDeleteBtn.disabled = true;
                try {
                    await apiRequest(`/api/notes/${noteId}`, { method: 'DELETE' });
                    const deletedIndex = notesData.findIndex(note => note.id === noteId);
                    notesData.splice(deletedIndex, 1);
                    noteItem?.remove();
                    closeDeleteDialog();

                    if (activeId === noteId) {
                        activeId = notesData[0]?.id;
                        if (activeId !== undefined) switchNote(activeId);
                        else {
                            noteTitleInput.value = '';
                            noteContent.value = '';
                        }
                    }
                } catch (error) {
                    console.error('刪除筆記失敗', error);
                    deleteDialogMessage.textContent = '刪除失敗，請確認 Python 後端是否正在執行。';
                } finally {
                    confirmDeleteBtn.disabled = false;
                }
            }

            // ─── 事件：點擊筆記項目 ───
            noteList.addEventListener('click', function(e) {
                const actionButton = e.target.closest('.note-actions button');
                if (actionButton) {
                    e.stopPropagation();
                    openDeleteDialog(parseInt(e.target.closest('.note-item')?.dataset.id));
                    return;
                }
                const item = e.target.closest('.note-item');
                const id = parseInt(item?.dataset.id);
                if (!isNaN(id) && id !== activeId) switchNote(id);
            });

            // ─── 事件：搜尋過濾 ───
            searchInput.addEventListener('input', function() {
                const keyword = this.value.trim().toLowerCase();
                document.querySelectorAll('.note-item').forEach(item => {
                    const title = item.querySelector('.note-title')?.textContent?.toLowerCase() || '';
                    const match = title.includes(keyword);
                    item.style.display = match ? '' : 'none';
                });
            });

            // ─── 事件：新增筆記 (模擬) ───
            newNoteBtn.addEventListener('click', function() {
                const newId = Date.now();
                const newNote = {
                    id: newId,
                    title: '未命名筆記',
                    tag: '草稿',
                    tagStyle: 'background:#f1f5f9;color:#475569;',
                    content: '開始撰寫你的筆記…',
                    time: '剛剛',
                    editors: ['green']
                };
                notesData.push(newNote);
                apiRequest('/api/notes', {
                    method: 'POST',
                    body: JSON.stringify(newNote)
                }).then(savedNote => {
                    newNote.id = savedNote.id;
                    item.dataset.id = savedNote.id;
                    activeId = savedNote.id;
                }).catch(error => console.error('新增筆記失敗', error));

                // 建立 DOM 元素
                const item = document.createElement('div');
                item.className = 'note-item active';
                item.dataset.id = newId;
                item.innerHTML = `
                    <div class="note-icon"><i class="fas fa-file-alt"></i></div>
                    <div class="note-content">
                        <div class="note-title">
                            未命名筆記
                            <span class="tag" style="${newNote.tagStyle}">草稿</span>
                        </div>
                        <div class="note-meta">
                            <span><i class="far fa-clock"></i> 剛剛</span>
                            <span class="editors">
                                <i class="fas fa-user-edit"></i>
                                <span class="dot green"></span>
                            </span>
                        </div>
                    </div>
                    <div class="note-actions">
                            <button title="刪除筆記" type="button"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;

                // 移除其他 active
                document.querySelectorAll('.note-item').forEach(el => el.classList.remove('active'));
                // 插入到列表最上方
                const list = document.getElementById('noteList');
                list.insertBefore(item, list.firstChild);

                // 更新狀態
                activeId = newId;
                noteTitleInput.value = '未命名筆記';
                noteContent.value = '開始撰寫你的筆記…';

                item.scrollIntoView({ block: 'nearest' });

                // 自動聚焦標題
                noteTitleInput.focus();
                noteTitleInput.select();
            });

            cancelDeleteBtn.addEventListener('click', closeDeleteDialog);
            confirmDeleteBtn.addEventListener('click', deleteNote);
            deleteDialog.addEventListener('click', function(e) {
                if (e.target === deleteDialog) closeDeleteDialog();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && deleteDialog.classList.contains('visible')) closeDeleteDialog();
            });

            // ─── 事件：編輯標題即時更新列表 ───
            noteTitleInput.addEventListener('input', function() {
                const val = this.value.trim() || '未命名筆記';
                const activeItem = document.querySelector('.note-item.active');
                if (activeItem) {
                    const titleSpan = activeItem.querySelector('.note-title');
                    if (titleSpan) {
                        // 保留 tag
                        const tagEl = titleSpan.querySelector('.tag');
                        if (tagEl) {
                            titleSpan.childNodes.forEach(node => {
                                if (node.nodeType === 3) {
                                    node.textContent = val + ' ';
                                }
                            });
                        } else {
                            titleSpan.textContent = val;
                        }
                    }
                }
                // 同步資料
                const data = notesData.find(d => d.id === activeId);
                if (data) {
                    data.title = val;
                    saveActiveNote();
                }
            });

            // ─── 事件：編輯內容即時更新資料 (模擬) ───
            noteContent.addEventListener('input', function() {
                const data = notesData.find(d => d.id === activeId);
                if (data) {
                    data.content = this.value;
                    saveActiveNote();
                }
            });

            window.addEventListener('pagehide', saveActiveNoteImmediately);

            // ─── 初始化：確保顯示正確 ───
            apiRequest('/api/notes')
                .then(serverNotes => {
                    notesData.splice(0, notesData.length, ...serverNotes);
                    serverNotes.forEach(note => {
                        if (document.querySelector(`.note-item[data-id="${note.id}"]`)) return;
                        const item = document.createElement('div');
                        item.className = 'note-item';
                        item.dataset.id = note.id;
                        item.innerHTML = `
                            <div class="note-icon"><i class="fas fa-file-alt"></i></div>
                            <div class="note-content">
                                <div class="note-title">${note.title}<span class="tag" style="${note.tagStyle}">${note.tag}</span></div>
                                <div class="note-meta"><span><i class="far fa-clock"></i> ${note.time}</span><span class="editors"><i class="fas fa-user-edit"></i><span class="dot green"></span></span></div>
                            </div>
                            <div class="note-actions"><button title="刪除筆記" type="button"><i class="fas fa-trash-alt"></i></button></div>`;
                        document.getElementById('noteList').appendChild(item);
                    });
                    activeId = serverNotes[0]?.id;
                    if (activeId !== undefined) switchNote(activeId);
                })
                .catch(error => {
                    console.error('無法連接 Python 後端', error);
                    noteTitleInput.value = '';
                    noteContent.value = '';
                });

            // ─── (選用) 鍵盤快捷鍵: Ctrl+Shift+N 新增 ───
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && (e.key === 'N' || e.key === 'n')) {
                    e.preventDefault();
                    newNoteBtn.click();
                }
            });

            console.log('📝 CollabNote UI 已啟動 — 多人共享筆記介面');
        })();
    </script>

</body>
</html>
